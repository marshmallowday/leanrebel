name: ReBeL checks

on:
  push:
    branches: [main, 'rebel/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Exact-source snapshot for reproducible review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Archive tracked source only, without Git credentials or local state
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git archive --format=tar --output="$RUNNER_TEMP/rebel-source.tar" HEAD
          sha256sum "$RUNNER_TEMP/rebel-source.tar" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebel-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rebel-source.tar
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 7
          if-no-files-found: error

  diagnostics:
    name: ReBeL compiler, lint, and transitive axiom checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check static architecture before the compiler loop
        shell: pwsh
        run: |
          ./scripts/phase2-audit.ps1 -VerifyExpected 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/rebel-architecture.log"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Identify exact source and toolchain
        run: |
          git rev-parse HEAD
          lake env lean --version
      - name: Fetch the actual ReBeL Mathlib dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/rebel-mathlib-roots.txt"
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/rebel')
          from audit_axioms import proof_modules
          pending = proof_modules()
          seen, roots = set(), set()
          while pending:
              name = pending.pop()
              if name in seen:
                  continue
              seen.add(name)
              if name.startswith('Mathlib.'):
                  roots.add(name)
                  continue
              path = Path(name.replace('.', '/') + '.lean')
              if path.is_file():
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if line.startswith('import '):
                          pending.extend(line.split()[1:])
          if not roots:
              raise SystemExit('No Mathlib dependency roots found')
          print(' '.join(sorted(roots)))
          PY
          cat "$RUNNER_TEMP/rebel-mathlib-roots.txt"
          lake exe cache get $(cat "$RUNNER_TEMP/rebel-mathlib-roots.txt")
      - name: Check ledger, inventory, and adversarial fixtures
        run: |
          python3 scripts/rebel/check_coverage.py
          python3 scripts/rebel/check_inventory.py
          python3 -W error -m unittest discover -s scripts/rebel/tests -v
      - name: Compile and lint every ReBeL module and audit transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/rebel-validation.log"
          python3 scripts/rebel/audit_axioms.py 2>&1 | tee -a "$RUNNER_TEMP/rebel-validation.log"
      - name: Publish compiler diagnostics without replacing the failing gate
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'rebel-validation.log'
          if path.exists():
              text = path.read_text(encoding='utf-8', errors='replace')
              pattern = re.compile(r'^error: ([^\n]+\.lean):(\d+):(\d+): (.*?)(?=^error: |^trace: |^[✔✖]|\Z)', re.M | re.S)
              for match in list(pattern.finditer(text))[:40]:
                  file, line, column, message = match.groups()
                  message = message[:10000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error file={file},line={line},col={column}::{message}')
          PY
      - name: Check tracked-file cleanliness
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rebel-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rebel-validation.log
            ${{ runner.temp }}/rebel-mathlib-roots.txt
            ${{ runner.temp }}/rebel-architecture.log
          retention-days: 7
          if-no-files-found: warn
