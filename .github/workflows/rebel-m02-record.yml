name: M02 acceptance record preparation

on:
  push:
    branches: [rebel/m02]
    paths: [.github/workflows/rebel-m02-record.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'marshmallowday/leanrebel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Prepare unattached record blobs only; the assistant updates refs separately.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Repair two mapping keys in the pinned record preparation and run its guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, hashlib, json, os, textwrap, urllib.request
          repository = 'marshmallowday/leanrebel'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          original_blob = 'c24cc84d8adf908a31c089baf1e6ac91b7eb39b0'
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/git/blobs/{original_blob}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              stored = json.load(response)
          raw = base64.b64decode(stored['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == original_blob
          workflow = raw.decode('utf-8')
          begin = "          python3 -u - <<'PY'\n"
          end = '          PY\n'
          assert workflow.count(begin) == 1 and workflow.count(end) == 1
          script = textwrap.dedent(workflow.split(begin, 1)[1].split(end, 1)[0])
          for old, new in (("'P-FIG1-A':", "'P-FIG1A':"), ("'P-ZEROSUM':", "'P-ZERO-SUM':")):
              assert script.count(old) == 1
              script = script.replace(old, new)
          print('RECORD_MAPPING_KEYS_CORRECTED; original source ledger unchanged')
          exec(compile(script, '<pinned-M02-record-preparation>', 'exec'),
               {'__name__': '__main__'})
          PY
