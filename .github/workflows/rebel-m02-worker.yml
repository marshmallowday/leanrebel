name: ReBeL M02 temporary compiler worker

on:
  push:
    branches: ['rebel/m02']
    paths: ['.github/workflows/rebel-m02-worker.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebel-m02-worker
  cancel-in-progress: true

jobs:
  compiler:
    if: github.ref == 'refs/heads/rebel/m02'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rebel/m02
          persist-credentials: true
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Compile pinned shared semantics
        run: lake build GameTheory.Protocol GameTheory.Languages.FOSG
      - name: Execute explicit branch requests and publish reviewable results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, traceback
          root = pathlib.Path.cwd()
          request = root / '.m02-request.json'
          response = root / '.m02-response.json'
          output = root / '.m02-response.log'
          last = None
          deadline = time.monotonic() + 45 * 60
          allowed = ('GameTheory/ReBeL', 'docs/rebel/', 'scripts/rebel/',
                     'docs/decisions/', 'docs/ExperimentLog.md',
                     'scripts/phase2-audit.ps1', 'scripts/phase3-audit.ps1',
                     'lint/GameTheory/LintAll.lean', '.github/workflows/rebel.yml',
                     '.m02-response.json', '.m02-response.log')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if os.environ.get('GITHUB_REPOSITORY') != 'marshmallowday/leanrebel':
              raise SystemExit('Unexpected repository')
          if git('branch', '--show-current') != 'rebel/m02':
              raise SystemExit('Unexpected branch')
          while time.monotonic() < deadline:
              subprocess.run(['git', 'fetch', 'origin', 'rebel/m02'], check=True,
                             stdout=subprocess.DEVNULL)
              subprocess.run(['git', 'merge', '--ff-only', 'FETCH_HEAD'], check=True,
                             stdout=subprocess.DEVNULL)
              if not request.is_file():
                  time.sleep(10)
                  continue
              data = request.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest == last:
                  time.sleep(10)
                  continue
              command = json.loads(data)
              if command.get('stop') is True:
                  print('M02_WORKER_STOP_REQUEST', flush=True)
                  break
              script = command.get('script')
              if not isinstance(script, str) or not script.strip():
                  raise SystemExit('Request must contain an explicit script')
              timeout = min(max(int(command.get('timeout_seconds', 300)), 1), 1200)
              before = git('rev-parse', 'HEAD')
              started = time.monotonic()
              temp = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm02-command.sh'
              temp.write_text(script, encoding='utf-8')
              try:
                  result = subprocess.run(['bash', '-eu', '-o', 'pipefail', str(temp)],
                      cwd=root, text=True, stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT, timeout=timeout)
                  code, log = result.returncode, result.stdout
              except subprocess.TimeoutExpired as exc:
                  code, log = 124, exc.stdout or ''
                  if isinstance(log, bytes):
                      log = log.decode('utf-8', errors='replace')
                  log += '\nM02_COMMAND_TIMEOUT\n'
              output.write_text(log, encoding='utf-8')
              response.write_text(json.dumps({
                  'request_sha256': digest, 'source_before': before,
                  'exit_code': code, 'elapsed_seconds': round(time.monotonic()-started, 3),
                  'log_bytes': len(log.encode('utf-8')),
                  'log_sha256': hashlib.sha256(log.encode('utf-8')).hexdigest(),
                  'toolchain': pathlib.Path('lean-toolchain').read_text().strip(),
                  'note': 'Iteration result, not a milestone completion claim.'
              }, indent=2) + '\n', encoding='utf-8')
              changed = git('ls-files', '-m', '-o', '--exclude-standard').splitlines()
              rejected = [p for p in changed if not p.startswith(allowed)]
              if rejected:
                  raise SystemExit('Refusing out-of-scope changes: ' + repr(rejected))
              if changed:
                  subprocess.run(['git', 'add', '--', *changed], check=True)
                  subprocess.run(['git', 'commit', '-m',
                    f'rebel(m02): compiler iteration {digest[:12]} exit={code} [skip ci]'], check=True)
                  # No force, rebase, automatic conflict resolution, or writes to main.
                  subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/rebel/m02'], check=True)
              last = digest
              print(f'M02_ITERATION request={digest} exit={code}', flush=True)
          else:
              print('M02_WORKER_TIME_BUDGET_REACHED', flush=True)
          PY
