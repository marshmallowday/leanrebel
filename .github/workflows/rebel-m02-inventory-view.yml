name: ReBeL M02 inventory review

on:
  push:
    branches: ['rebel/m02']
    paths: ['.github/workflows/rebel-m02-inventory-view.yml']

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read complete source inventory without executing indexed source
        env:
          PART: ${{ matrix.part }}
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          raw = Path('docs/rebel/inventory/official.json.gz').read_bytes()
          text = gzip.decompress(raw).decode('utf-8')
          part = int(os.environ['PART'])
          start = len(text) * part // 4
          stop = len(text) * (part + 1) // 4
          print('COMPRESSED_SHA256', hashlib.sha256(raw).hexdigest())
          print('TOTAL_CHARACTERS', len(text), 'START', start, 'STOP', stop)
          print('BEGIN_EXACT_INVENTORY_SLICE')
          print(text[start:stop])
          print('END_EXACT_INVENTORY_SLICE')
          PY
