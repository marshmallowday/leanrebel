name: M01 reviewed inventory assembly

on:
  push:
    branches: ['rebel/m01-b']
    paths:
      - '.github/workflows/rebel-m01-materialize.yml'
      - 'scripts/rebel/m01_publish_blobs.py'
      - 'scripts/rebel/inventory_official.py'
      - 'scripts/rebel/compare_papers.py'
      - 'scripts/rebel/reuse_manifest.py'
      - 'scripts/rebel/source_manifest.py'

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'marshmallowday/leanrebel' && github.ref == 'refs/heads/rebel/m01-b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needed only to store already hash-reviewed blobs in THIS repository.
    # This job never creates/updates refs or commits; the plugin does that.
    # Remove this one-time writer before integration; normal CI stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: facebookresearch/rebel
          ref: 7960a42750f3407ea9eb2c3333d4c2a7961f6df4
          path: .lake/rebel-official
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - name: Install pinned syntax and PDF readers, not the official runtime
        run: python -m pip install tree-sitter==0.25.2 tree-sitter-cpp==0.23.4 PyYAML==6.0.3 PyMuPDF==1.26.7
      - name: Reproduce the reviewed official index and candidate excerpts
        run: |
          mkdir -p docs/rebel/inventory
          git -C .lake/rebel-official ls-tree -rl HEAD > docs/rebel/inventory/official-tree.txt
          python scripts/rebel/inventory_official.py --source .lake/rebel-official --tree docs/rebel/inventory/official-tree.txt --output docs/rebel/inventory/official.json.gz
          python scripts/rebel/reuse_manifest.py .
      - name: Reproduce fixed-edition page fingerprints
        run: |
          mkdir -p "$RUNNER_TEMP/rebel-pdfs"
          curl --fail --location --retry 2 --max-time 180 'https://papers.nips.cc/paper/2020/file/c61f571dbd2fb949d3fe5ae1608dd48b-Paper.pdf' -o "$RUNNER_TEMP/rebel-pdfs/main.pdf"
          curl --fail --location --retry 2 --max-time 180 'https://papers.nips.cc/paper_files/paper/2020/file/c61f571dbd2fb949d3fe5ae1608dd48b-Supplemental.pdf' -o "$RUNNER_TEMP/rebel-pdfs/supp.pdf"
          curl --fail --location --retry 2 --max-time 180 'https://arxiv.org/pdf/2007.13544v2' -o "$RUNNER_TEMP/rebel-pdfs/arxiv-v2.pdf"
          python scripts/rebel/source_manifest.py "$RUNNER_TEMP/rebel-pdfs" docs/rebel/inventory/sources.json
      - name: Store only exact reviewed blobs in this fork, never move refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rebel/m01_publish_blobs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m01-generated-blob-ids
          path: ${{ runner.temp }}/m01-generated-blobs.json
          retention-days: 7
          if-no-files-found: error
