name: ReBeL M03 pinned environment

on:
  push:
    branches: ['rebel/m03']
    paths: ['.github/workflows/rebel-m03-environment.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Prepare pinned compiler and actual dependencies
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          lake env lean --version
          python3 - <<'PY' > "$RUNNER_TEMP/roots.txt"
          from pathlib import Path
          pending = ['GameTheory.ReBeL', 'GameTheory.Analysis.Protocol.CounterfactualReach',
                     'GameTheory.Protocol.BehavioralAssessment']
          seen, roots = set(), set()
          while pending:
              name = pending.pop()
              if name in seen:
                  continue
              seen.add(name)
              if name.startswith('Mathlib.'):
                  roots.add(name)
                  continue
              p = Path(name.replace('.', '/') + '.lean')
              if p.is_file():
                  for line in p.read_text().splitlines():
                      if line.startswith('import '):
                          pending.extend(line.split()[1:])
          print(' '.join(sorted(roots)))
          PY
          lake exe cache get $(cat "$RUNNER_TEMP/roots.txt")
          lake build GameTheory.ReBeL GameTheory.Analysis.Protocol.CounterfactualReach
      - name: Export compiler data only; no credentials, Git state, or user data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m03-environment"
          TOOLCHAIN=$(dirname "$(dirname "$(lake env which lean)")")
          tar --zstd -cf "$RUNNER_TEMP/m03-environment/toolchain.tar.zst" \
            --exclude='*.a' --exclude='*.o' --exclude='*.c' --exclude='*.bc' \
            -C "$TOOLCHAIN" bin lib share src include
          tar --zstd -cf "$RUNNER_TEMP/m03-environment/dependencies.tar.zst" \
            --exclude='.git' --exclude='*.a' --exclude='*.o' --exclude='*.c' \
            --exclude='*.bc' --exclude='*.ltar' --exclude='.cache' .lake
          git rev-parse HEAD > "$RUNNER_TEMP/m03-environment/source-commit.txt"
          (cd "$RUNNER_TEMP/m03-environment" && sha256sum *.tar.zst > SHA256SUMS)
          du -h "$RUNNER_TEMP/m03-environment/"*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebel-m03-pinned-environment
          path: ${{ runner.temp }}/m03-environment/*
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
