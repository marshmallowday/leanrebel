name: ReBeL inventory parser acquisition

# Temporary M01-B review tooling. No project or official implementation runs.
on:
  push:
    branches: ['rebel/m01-a']
    paths: ['.github/workflows/rebel-inventory-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acquire pinned syntax-only parser wheels for the review environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parser-wheels"
          python3 -m pip download --dest "$RUNNER_TEMP/parser-wheels" \
            --only-binary=:all: --platform manylinux2014_x86_64 \
            --python-version 313 --implementation cp --abi cp313 --abi abi3 --abi none \
            tree-sitter==0.25.2 tree-sitter-cpp==0.23.4
          cd "$RUNNER_TEMP/parser-wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebel-inventory-parser
          path: ${{ runner.temp }}/parser-wheels/
          retention-days: 7
          if-no-files-found: error
