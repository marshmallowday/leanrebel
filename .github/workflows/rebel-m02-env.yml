name: ReBeL M02 compiler workspace

on:
  push:
    branches: ['rebel/m02']
    paths: ['.github/workflows/rebel-m02-env.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-m02-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Cache only the semantic dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/mathlib-roots.txt"
          from pathlib import Path
          pending = ['GameTheory.Protocol', 'GameTheory.Languages.FOSG']
          seen, roots = set(), set()
          while pending:
              name = pending.pop()
              if name in seen:
                  continue
              seen.add(name)
              if name.startswith('Mathlib.'):
                  roots.add(name)
                  continue
              path = Path(name.replace('.', '/') + '.lean')
              if path.is_file():
                  for line in path.read_text().splitlines():
                      if line.startswith('import '):
                          pending.extend(line.split()[1:])
          roots.update(['Mathlib.Tactic.NormNum', 'Mathlib.Tactic.Linarith', 'Mathlib.Tactic.FinCases', 'Mathlib.Data.Fintype.List'])
          print(' '.join(sorted(roots)))
          PY
          lake exe cache get $(cat "$RUNNER_TEMP/mathlib-roots.txt")
      - name: Compile the existing semantic dependency surface
        run: |
          git rev-parse HEAD
          lake env lean --version
          lake build GameTheory.Protocol GameTheory.Languages.FOSG
          df -h .
          du -sh .lake "$(lean --print-prefix)"
      - name: Archive and split below the connector's 512 MiB limit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          tar -I 'zstd -T2 -3' -cf "$RUNNER_TEMP/toolchain.tar.zst" -C "$(lean --print-prefix)" .
          tar -I 'zstd -T2 -3' -cf "$RUNNER_TEMP/lake.tar.zst" .lake lean-toolchain lake-manifest.json
          cd "$RUNNER_TEMP"
          sha256sum toolchain.tar.zst lake.tar.zst > workspace.sha256
          split -b 450000000 -d -a 2 toolchain.tar.zst toolchain.part
          split -b 450000000 -d -a 2 lake.tar.zst lake.part
          sha256sum *.part* > parts.sha256
          test ! -f toolchain.part02
          test ! -f lake.part03
          ls -lh *.part*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-toolchain-00-${{ github.sha }}
          path: ${{ runner.temp }}/toolchain.part00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-toolchain-01-${{ github.sha }}
          path: ${{ runner.temp }}/toolchain.part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-lake-00-${{ github.sha }}
          path: ${{ runner.temp }}/lake.part00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-lake-01-${{ github.sha }}
          path: ${{ runner.temp }}/lake.part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-lake-02-${{ github.sha }}
          path: ${{ runner.temp }}/lake.part02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m02-workspace-hashes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workspace.sha256
            ${{ runner.temp }}/parts.sha256
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
          if-no-files-found: error
