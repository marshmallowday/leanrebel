name: ReBeL M02 compiler workspace

on:
  push:
    branches: ['rebel/m02']
    paths: ['.github/workflows/rebel-m02-env.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-m02-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Compile the existing semantic dependency surface
        run: |
          git rev-parse HEAD
          lake env lean --version
          lake build GameTheory.Protocol GameTheory.Languages.FOSG
      - name: Package pinned toolchain and public dependency workspace only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m02-export/toolchain" "$RUNNER_TEMP/m02-export/workspace"
          prefix="$(lean --print-prefix)"
          cp -a "$prefix"/. "$RUNNER_TEMP/m02-export/toolchain/"
          cp -a .lake "$RUNNER_TEMP/m02-export/workspace/"
          git rev-parse HEAD > "$RUNNER_TEMP/m02-export/source-commit.txt"
          cp lean-toolchain lake-manifest.json "$RUNNER_TEMP/m02-export/"
          # No checkout .git, credentials, environment variables or private keys are exported.
          du -sh "$RUNNER_TEMP/m02-export"/*
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/rebel-m02-workspace.tar.zst" -C "$RUNNER_TEMP/m02-export" .
          sha256sum "$RUNNER_TEMP/rebel-m02-workspace.tar.zst" > "$RUNNER_TEMP/rebel-m02-workspace.sha256"
          ls -lh "$RUNNER_TEMP/rebel-m02-workspace.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebel-m02-workspace-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rebel-m02-workspace.tar.zst
            ${{ runner.temp }}/rebel-m02-workspace.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
