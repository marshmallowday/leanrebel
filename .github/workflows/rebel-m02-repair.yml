name: M02 architecture repair preparation

on:
  push:
    branches: [rebel/m02]
    paths: [.github/workflows/rebel-m02-repair.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'marshmallowday/leanrebel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Writes only unattached blobs in this repository, never commits or refs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test exact source repairs and publish only their blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import base64, difflib, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          repo = 'marshmallowday/leanrebel'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          def request(path, payload=None):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          original = {row['path']: row['sha'] for row in request(
              'git/trees/440a4bcac94e5540f41ec554a9f15a84a2856253?recursive=1')['tree']}
          prefix = 'GameTheory/ReBeL/Examples/'
          hidden_change = '      change target ∈ (FinDist.pure (.finished firstWin (finalResult types joint))).support at realized'
          hidden_wrapped = '      change target ∈\n        (FinDist.pure (.finished firstWin (finalResult types joint))).support at realized'
          dice_change = '      change target ∈ (FinDist.pure (advance dice turn last (selected joint turn))).support at realized'
          dice_wrapped = '      change target ∈\n        (FinDist.pure (advance dice turn last (selected joint turn))).support at realized'
          potential = '    potential event.target i = potential event.source i + reward prior event.source event.joint i := by'
          potential_wrapped = '    potential event.target i =\n      potential event.source i + reward prior event.source event.joint i := by'
          edits = {
            'HiddenTypes.lean': [(hidden_change, hidden_wrapped, 2)],
            'HiddenTypesHistories.lean': [(
              '      ((model fullPrior).run (fun i => fullPlanPolicy fullPrior i (baselinePlans i)) 2)).support := by',
              '      ((model fullPrior).run\n        (fun i => fullPlanPolicy fullPrior i (baselinePlans i)) 2)).support := by', 1)],
            'HiddenTypesPayoff.lean': [(potential, potential_wrapped, 1), (hidden_change, hidden_wrapped, 1), (
              '        (finalResult types (secondJoint plans types (firstResult (firstJoint plans types))))) i) := by',
              '        (finalResult types\n          (secondJoint plans types (firstResult (firstJoint plans types))))) i) := by', 1)],
            'LiarsDice.lean': [(
              '    (last : Option Bid) (joint : Joint) (legal : (protocol prior).Legal (.live dice turn last) joint) :',
              '    (last : Option Bid) (joint : Joint)\n    (legal : (protocol prior).Legal (.live dice turn last) joint) :', 1),
              (dice_change, dice_wrapped, 1)],
            'LiarsDicePayoff.lean': [(potential, potential_wrapped, 1), (dice_change, dice_wrapped, 1), (
              '    (selected (fun i => bidCallAction opening i (view i (.live dice turn (some previous)))) turn))).bind',
              '    (selected\n      (fun i => bidCallAction opening i (view i (.live dice turn (some previous)))) turn))).bind', 1)],
            'ObservedDice.lean': [(
              '      (fun history : protocol.History => (fullSignals revealingSignals).infoOf i history.trace) := by',
              '      (fun history : protocol.History =>\n        (fullSignals revealingSignals).infoOf i history.trace) := by', 1)]}
          prepared = {}
          count = 0
          for name, replacements in edits.items():
              path = Path(prefix + name); data = path.read_bytes()
              assert blob_sha(data) == original[str(path)], str(path)
              before = data.decode('utf-8'); after = before
              for old, new, n in replacements:
                  assert after.count(old) == n, (name, old)
                  after = after.replace(old, new); count += n
              assert re.sub(r'\s', '', before) == re.sub(r'\s', '', after)
              assert all(len(line.encode('utf-16-le')) // 2 <= 100 for line in after.splitlines())
              print(''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True),
                  fromfile='a/' + str(path), tofile='b/' + str(path))))
              path.write_text(after, encoding='utf-8', newline='\n'); prepared[str(path)] = after
          assert count == 12
          script = Path('scripts/phase2-audit.ps1')
          assert blob_sha(script.read_bytes()) == '5f63de667144f4a8367c62f19bff85c6bb548ee6'
          patched = base64.b64decode(request('git/blobs/87cddf87fc81d7efd0e1ae2bd1f51a5a0b5918d7')['content'])
          assert blob_sha(patched) == '87cddf87fc81d7efd0e1ae2bd1f51a5a0b5918d7'
          script.write_bytes(patched)
          def audit(phase):
              return subprocess.run(['pwsh', '-NoProfile', '-File', f'scripts/phase{phase}-audit.ps1',
                  '-VerifyExpected'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          for phase in (2, 3):
              result = audit(phase); print(result.stdout); assert result.returncode == 0
          # Negative controls change only this runner's checkout and always restore it.
          controls = [
            ('GameTheory/ReBeLUnregistered.lean', 'example : True := True.intro\n', 'UNBUCKETED_FILES'),
            ('GameTheory/ReBeL/Knowledge.lean', '\naxiom auditForbidden : False\n', 'CUSTOM_AXIOM'),
            ('GameTheory/ReBeL/Knowledge.lean', '\nexample : True := by\n  change True\n  trivial\n', 'TRANSPORT_REBEL_SOURCE')]
          for path_string, addition, marker in controls:
              path = Path(path_string); previous = path.read_bytes() if path.exists() else None
              try:
                  path.write_bytes((previous or b'') + addition.encode())
                  result = audit(2)
                  assert result.returncode != 0 and marker in result.stdout and 'expected' in result.stdout
                  print('MUTANT_REJECTED', marker)
              finally:
                  if previous is None: path.unlink()
                  else: path.write_bytes(previous)
          result = audit(2); assert result.returncode == 0
          print('POST_MUTATION_RESTORE_PASS')
          for path, content in prepared.items():
              blob = request('git/blobs', {'content': content, 'encoding': 'utf-8'})
              assert blob['sha'] == blob_sha(content.encode())
              print('PREPARED_SOURCE_BLOB', path, blob['sha'])
          print('WHITESPACE_ONLY_REPAIRS_PASS lines=12 files=6')
          print('No commit or branch reference was changed by this job.')
          PY
