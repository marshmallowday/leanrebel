name: ReBeL M04 offline compiler snapshot

on:
  push:
    branches: ['rebel/m04']
    paths: ['.github/workflows/rebel-m04-environment.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-m04-environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Export pinned compiler and built dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m04-offline"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          lake env lean --version > "$out/lean-version.txt"
          sha256sum lean-toolchain lake-manifest.json > "$out/pin-sha256.txt"
          prefix="$(lake env lean --print-prefix)"
          tar --exclude='*.a' --exclude='*.o' -I 'zstd -T0 -3' \
            -cf "$out/toolchain.tar.zst" -C "$prefix" .
          tar --exclude='.git' --exclude='*.a' --exclude='*.o' --exclude='*.c' \
            -I 'zstd -T0 -3' -cf "$out/compiled-source.tar.zst" \
            .lake/build .lake/packages lakefile.lean lake-manifest.json lean-toolchain
          cd "$out"
          sha256sum *.tar.zst > archive-sha256.txt
          cat source-commit.txt lean-version.txt pin-sha256.txt archive-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebel-m04-offline-${{ github.sha }}
          path: ${{ runner.temp }}/m04-offline
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
