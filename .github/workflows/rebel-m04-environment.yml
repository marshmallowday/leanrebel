name: ReBeL M04 offline compiler snapshot

on:
  push:
    branches: ['rebel/m04']
    paths: ['.github/workflows/rebel-m04-environment.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebel-m04-environment-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf733bd1ffa977681d1197bf80b1dfd7be82ff6e
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Export pinned compiler in pieces below the plugin 512 MiB limit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m04-compiler"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          lake env lean --version > "$out/lean-version.txt"
          sha256sum lean-toolchain lake-manifest.json > "$out/pin-sha256.txt"
          prefix="$(lake env lean --print-prefix)"
          df -h > "$out/disk-before.txt"
          du -sh "$prefix" >> "$out/disk-before.txt"
          tar --exclude='*.a' --exclude='*.o' --exclude='*.ilean' \
            --exclude='*.olean.server' -I 'zstd -T2 -3' \
            -cf "$out/toolchain.tar.zst" -C "$prefix" .
          cd "$out"
          sha256sum toolchain.tar.zst > archive-sha256.txt
          split -b 384M -d -a 1 toolchain.tar.zst toolchain.tar.zst.part-
          sha256sum *.part-* > parts-sha256.txt
          rm toolchain.tar.zst
          test -f toolchain.tar.zst.part-0
          test -f toolchain.tar.zst.part-1
          test ! -e toolchain.tar.zst.part-2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebel-m04-compiler-0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m04-compiler/toolchain.tar.zst.part-0
            ${{ runner.temp }}/m04-compiler/*.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebel-m04-compiler-1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m04-compiler/toolchain.tar.zst.part-1
            ${{ runner.temp }}/m04-compiler/*.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Fetch the pinned dependency cache without building the game library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m04-dependencies"
          python3 - <<'PY' > "$RUNNER_TEMP/m04-roots.txt"
          from pathlib import Path
          pending = ['GameTheory.ReBeL',
                     'GameTheory.Analysis.Protocol.CounterfactualRootRegret',
                     'GameTheory.Analysis.Protocol.CounterfactualZeroSumLearning',
                     'GameTheory.Analysis.Minimax']
          seen, roots = set(), set()
          while pending:
              name = pending.pop()
              if name in seen:
                  continue
              seen.add(name)
              if name.startswith('Mathlib.'):
                  roots.add(name)
                  continue
              path = Path(name.replace('.', '/') + '.lean')
              if path.is_file():
                  for line in path.read_text().splitlines():
                      if line.startswith('import '):
                          pending.extend(line.split()[1:])
          roots.add('Mathlib.Data.Finset.Sort')
          print(' '.join(sorted(roots)))
          PY
          lake exe cache get $(cat "$RUNNER_TEMP/m04-roots.txt")
      - name: Export public dependencies in pieces below the plugin limit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m04-dependencies"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          df -h > "$out/disk-before.txt"
          du -sh .lake/packages >> "$out/disk-before.txt"
          tar --exclude='.git' --exclude='*.a' --exclude='*.o' --exclude='*.c' \
            --exclude='*.ilean' --exclude='*.olean.server' \
            -I 'zstd -T2 -3' -cf "$out/dependencies.tar.zst" \
            .lake/packages lakefile.lean lake-manifest.json lean-toolchain
          cd "$out"
          sha256sum dependencies.tar.zst > archive-sha256.txt
          split -b 384M -d -a 1 dependencies.tar.zst dependencies.tar.zst.part-
          sha256sum *.part-* > parts-sha256.txt
          rm dependencies.tar.zst
          test -f dependencies.tar.zst.part-0
          test -f dependencies.tar.zst.part-1
          test ! -e dependencies.tar.zst.part-2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebel-m04-dependencies-0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m04-dependencies/dependencies.tar.zst.part-0
            ${{ runner.temp }}/m04-dependencies/*.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebel-m04-dependencies-1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m04-dependencies/dependencies.tar.zst.part-1
            ${{ runner.temp }}/m04-dependencies/*.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
