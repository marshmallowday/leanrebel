name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the unchanged build and architecture checks
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-latest' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and architecture audits
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Expose pinned Lean toolchain to Windows audit steps
        if: runner.os == 'Windows'
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          $lake = Join-Path $elanBin 'lake.exe'
          if (-not (Test-Path -LiteralPath $lake -PathType Leaf)) {
            throw "lean-action did not install the Lake shim at $lake"
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Identify exact validated source and toolchain
        run: |
          git rev-parse HEAD | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-source.txt"
          lake env lean --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify pinned toolchain' }

      - name: Check ReBeL inventory and compiler-resolved reuse signatures
        run: |
          python scripts/rebel/check_inventory.py --lean 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-inventory.log"
          if ($LASTEXITCODE -ne 0) { throw 'ReBeL inventory or candidate type check failed' }

      - name: Verify Phase 1 architecture measurements
        run: |
          ./scripts/phase1-audit.ps1 -VerifyExpected 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-phase1.log"

      - name: Verify Phase 2 architecture measurements and reachability probes
        run: |
          ./scripts/phase2-audit.ps1 -VerifyExpected -DeepReachability 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-phase2.log"

      - name: Verify Phase 3 architecture measurements and reachability probes
        run: |
          ./scripts/phase3-audit.ps1 -VerifyExpected -DeepReachability 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-phase3.log"

      - name: Lint the complete public library
        run: |
          lake lint 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-lint.log"
          if ($LASTEXITCODE -ne 0) { throw 'Full-library lint failed' }

      - name: Verify build and audits do not mutate tracked files
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Validation mutated tracked files' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-audits-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ci-source.txt
            ${{ runner.temp }}/ci-*.log
          retention-days: 7
          if-no-files-found: warn
